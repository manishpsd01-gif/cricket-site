<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crease Live Scores</title>
  <meta name="description" content="Live cricket scores, upcoming matches and results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Crease<br>Live Scores</h1>
      <div class="stamp" id="stamp">Loading…</div>
    </header>
    <nav id="tabs" aria-label="Filter matches">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="live" aria-pressed="false">Live</button>
      <button data-f="upcoming" aria-pressed="false">Upcoming</button>
      <button data-f="result" aria-pressed="false">Results</button>
    </nav>
    <div id="notice" class="notice" hidden></div>
    <main id="list" aria-live="polite"></main>
    <section id="detail" hidden></section>
    <footer>Scores refresh automatically every 30 seconds.</footer>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
